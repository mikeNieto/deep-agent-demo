<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Live Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0e1117; color: #fafafa; padding: 16px; max-width: 500px; margin: 0 auto; }
  .status-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.disconnected { background: #f44; }
  .dot.connecting { background: #fa0; animation: pulse 1s infinite; }
  .dot.idle { background: #4f4; }
  .dot.speaking { background: #4af; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .status-text { font-size: 13px; color: #888; }
  .controls { display: flex; gap: 6px; margin-bottom: 12px; }
  button {
    padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;
    background: #262730; color: #fafafa;
  }
  button:hover { background: #363740; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.record { background: #c33; }
  button.record.active { background: #0a0; }
  #chat {
    background: #13151a; border-radius: 10px; padding: 12px; height: 380px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;
  }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.4; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #1a56db; color: #fff; }
  .msg.assistant { align-self: flex-start; background: #262730; color: #ddd; display: flex; align-items: center; gap: 6px; }
  .msg.assistant .speaker { font-size: 16px; }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; padding: 8px 12px; border: 1px solid #444; border-radius: 6px;
    background: #262730; color: #fafafa; font-size: 14px; outline: none;
  }
  .input-row input:focus { border-color: #1a56db; }
  .empty { color: #555; text-align: center; padding: 40px 0; }
</style>
</head>
<body>

<div class="status-bar">
  <div class="dot disconnected" id="dot"></div>
  <span class="status-text" id="statusText">Disconnected</span>
</div>

<div class="controls">
  <button id="connectBtn">Connect</button>
  <button id="micBtn" class="record" disabled>🎤 Mic</button>
  <button id="disconnectBtn" disabled>Disconnect</button>
</div>

<div id="chat">
  <div class="empty">Connect to start</div>
</div>

<div class="input-row">
  <input id="textInput" type="text" placeholder="Type a message..." disabled>
  <button id="sendBtn" disabled>Send</button>
</div>

<script>
var WS_URL = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/api/live/ws';

var ws = null;
var audioCtx = null;
var stream = null;
var processor = null;
var micActive = false;
var playQueue = [];
var playing = false;
var assistantMsg = null;
var userInterimMsg = null;

function setStatus(state) {
  var dot = document.getElementById('dot');
  var text = document.getElementById('statusText');
  dot.className = 'dot ' + state;
  text.textContent = state === 'speaking' ? 'Speaking...' : state.charAt(0).toUpperCase() + state.slice(1);
}

function addMsg(role, content) {
  var chat = document.getElementById('chat');
  var empty = chat.querySelector('.empty');
  if (empty) empty.remove();

  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = content;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function connect() {
  setStatus('connecting');
  try { ws = new WebSocket(WS_URL); } catch (e) {
    setStatus('disconnected');
    return;
  }
  ws.onopen = function() {
    setStatus('idle');
    ws.send(JSON.stringify({
      type: 'setup',
      system_instruction: 'Respond in Spanish in a concise and helpful way.'
    }));
    document.getElementById('connectBtn').disabled = true;
    document.getElementById('disconnectBtn').disabled = false;
    document.getElementById('micBtn').disabled = false;
    document.getElementById('textInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
  };
  ws.onmessage = function(e) {
    var msg = JSON.parse(e.data);
    if (msg.type === 'text') {
      var role = msg.role || 'model';
      if (role === 'user') {
        if (msg.interim) {
          if (!userInterimMsg) {
            userInterimMsg = addMsg('user', '');
          }
          userInterimMsg.textContent = msg.content;
        } else {
          if (userInterimMsg) {
            userInterimMsg.textContent = msg.content;
            userInterimMsg = null;
          } else {
            addMsg('user', msg.content);
          }
        }
      } else {
        // model transcription
        if (!assistantMsg) {
          assistantMsg = addMsg('assistant', '');
        }
        assistantMsg.textContent += msg.content;
      }
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    } else if (msg.type === 'audio_out') {
      playAudio(msg.data);
    } else if (msg.type === 'status') {
      setStatus(msg.state);
      if (msg.state === 'speaking') {
        assistantMsg = null;
        userInterimMsg = null;
      } else if (msg.state === 'idle') {
        assistantMsg = null;
        userInterimMsg = null;
      }
    } else if (msg.type === 'error') {
      addMsg('assistant', 'Error: ' + msg.message);
    }
  };
  ws.onclose = function(e) {
    setStatus('disconnected');
    document.getElementById('connectBtn').disabled = false;
    document.getElementById('disconnectBtn').disabled = true;
    document.getElementById('micBtn').disabled = true;
    document.getElementById('textInput').disabled = true;
    document.getElementById('sendBtn').disabled = true;
    assistantMsg = null;
    if (micActive) stopMic();
  };
  ws.onerror = function() { setStatus('disconnected'); };
}

function disconnect() {
  if (micActive) stopMic();
  if (ws) ws.close();
}

function sendText() {
  var input = document.getElementById('textInput');
  var text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  addMsg('user', text);
  ws.send(JSON.stringify({type: 'text_in', text: text}));
  input.value = '';
}

function playAudio(base64Data) {
  var binary = atob(base64Data);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  playQueue.push(bytes);
  drainQueue();
}

function drainQueue() {
  if (playing || playQueue.length === 0) return;
  playing = true;
  var bytes = playQueue.shift();
  var pcm16 = new Int16Array(bytes.buffer);
  var float32 = new Float32Array(pcm16.length);
  for (var i = 0; i < pcm16.length; i++) float32[i] = pcm16[i] / 32768.0;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 24000});
  var buf = audioCtx.createBuffer(1, float32.length, 24000);
  buf.getChannelData(0).set(float32);
  var source = audioCtx.createBufferSource();
  source.buffer = buf;
  source.connect(audioCtx.destination);
  source.onended = function() { playing = false; drainQueue(); };
  source.start();
}

function toggleMic() {
  if (micActive) { stopMic(); return; }
  navigator.mediaDevices.getUserMedia({audio: true}).then(function(s) {
    stream = s;
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var rate = audioCtx.sampleRate;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({type: 'audio_config', sample_rate: rate}));
    }
    var source = audioCtx.createMediaStreamSource(stream);
    processor = audioCtx.createScriptProcessor(4096, 1, 1);
    processor.onaudioprocess = function(e) {
      if (!micActive || !ws || ws.readyState !== WebSocket.OPEN) return;
      var input = e.inputBuffer.getChannelData(0);
      var pcm16 = new Int16Array(input.length);
      for (var i = 0; i < input.length; i++) {
        pcm16[i] = Math.max(-32768, Math.min(32767, Math.round(input[i] * 32767)));
      }
      var base64 = btoa(String.fromCharCode.apply(null, new Uint8Array(pcm16.buffer)));
      ws.send(JSON.stringify({type: 'audio_in', data: base64}));
    };
    source.connect(processor);
    processor.connect(audioCtx.destination);
    micActive = true;
    document.getElementById('micBtn').textContent = '🎤 Stop';
    document.getElementById('micBtn').classList.add('active');
  }).catch(function(err) {
    addMsg('assistant', 'Mic error: ' + err.message);
  });
}

function stopMic() {
  micActive = false;
  if (processor) { processor.disconnect(); processor = null; }
  if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
  document.getElementById('micBtn').textContent = '🎤 Mic';
  document.getElementById('micBtn').classList.remove('active');
}

document.getElementById('connectBtn').addEventListener('click', connect);
document.getElementById('disconnectBtn').addEventListener('click', disconnect);
document.getElementById('micBtn').addEventListener('click', toggleMic);
document.getElementById('sendBtn').addEventListener('click', sendText);
document.getElementById('textInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendText();
});
</script>
</body>
</html>
