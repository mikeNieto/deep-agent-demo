[project]
name = "app"
version = "0.1.0"
description = "Test Google Gemini 3.1 Flash Live via WebSocket"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.49.0",
    "google-genai>=1.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
live-api = "app.main:run"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
]
