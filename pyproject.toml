[project]
name = "agent"
version = "0.1.0"
description = "Agente conversacional con FastAPI, WebSockets, Deep Agents y Google Gemini"
readme = "README.md"
authors = [
    { name = "Developer", email = "dev@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.6.8",
    "fastapi>=0.136.3",
    "langchain-google-genai>=3.1.0",
    "pydantic-settings>=2.14.1",
    "uvicorn>=0.49.0",
]

[project.scripts]
agent-api = "app.main:run"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
